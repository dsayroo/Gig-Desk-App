# Free Supabase projects pause after 7 days with no activity.
# This pings the song-request database every 3 days so it's awake at the next gig.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 14 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the database
        run: |
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" config.js | head -1)
          KEY=$(grep -oE "supabaseAnonKey: *'[^']+'" config.js | sed -E "s/.*'([^']+)'/\1/")
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "config.js isn't filled in yet; nothing to ping."; exit 0; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/rq_ping" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
