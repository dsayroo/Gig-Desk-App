<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Event Planning Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one calm column — event hero, checklist, form sections, send-to-DJ bar pinned at the bottom */
:root{
  --bg:#F2F1EE; --surface:#FFFFFF; --surface-2:#F7F6F3; --ink:#17181F; --muted:#5E6170; --line:#DEDCD6;
  --accent:#D9540A; --accent-ink:#FFFFFF; --accent-soft:#FCE8DA; --ok:#17804F; --ok-soft:#DAF1E4; --warn:#9A5D00; --warn-soft:#FAEFD6;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1015; --surface:#181A22; --surface-2:#1E2029; --ink:#EDEDF2; --muted:#9EA1B0; --line:#2C2F3B;
  --accent:#FF7B30; --accent-ink:#1B0C03; --accent-soft:#3A2214; --ok:#40C985; --ok-soft:#12301F; --warn:#EFB042; --warn-soft:#33270E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1015; --surface:#181A22; --surface-2:#1E2029; --ink:#EDEDF2; --muted:#9EA1B0; --line:#2C2F3B;
  --accent:#FF7B30; --accent-ink:#1B0C03; --accent-soft:#3A2214; --ok:#40C985; --ok-soft:#12301F; --warn:#EFB042; --warn-soft:#33270E; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.5}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:800}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.85rem}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 140px;display:flex;flex-direction:column;gap:16px}
.brandbar{display:flex;align-items:center;gap:8px;font:800 .95rem var(--display);letter-spacing:.02em}
.brandbar svg{width:24px;height:24px;flex:none}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px}
.count{display:flex;align-items:baseline;gap:8px}
.count b{font:800 2.6rem var(--display);color:var(--accent);line-height:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 .74rem var(--body);padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.bar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;flex:1;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.need{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.need:first-child{border-top:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .92rem var(--body);padding:9px 16px;border-radius:9px;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:6px 8px}
.btn.sm{padding:6px 12px;font-size:.84rem}
details.fs{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);scroll-margin-top:16px}
details.fs>summary{list-style:none;cursor:pointer;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.fs>summary::-webkit-details-marker{display:none}
details.fs>.in{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:500;min-width:0}
.req{color:var(--accent)}
input,select,textarea{font:400 1rem var(--body);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.9rem;cursor:pointer;background:var(--surface)}
.chip input{width:15px;height:15px;accent-color:var(--accent)}
.chip:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.lrow{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr)) 36px;gap:6px;align-items:center}
@media (max-width:540px){.lrow{grid-template-columns:1fr 36px}.lrow>*:not(:last-child){grid-column:1}.lrow>:last-child{grid-column:2;grid-row:1}}
.tl{display:flex;flex-direction:column}
.tli{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.tli:first-child{border-top:0}
.t{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.9rem}
.ln{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.ln span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ln.tot{border-top:1.5px solid var(--ink);margin-top:4px;padding-top:9px;font-weight:600}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:10px}
.dock .in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;justify-content:space-between}
.dock .btn.pri{padding:11px 18px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--surface);border-radius:16px;max-width:560px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px;max-height:90%;overflow:auto}
.contact{font:700 1.1rem var(--mono);word-break:break-all;user-select:all;background:var(--surface-2);border-radius:9px;padding:10px 12px}
.step{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.step b{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);align-items:center;justify-content:center;font:700 .85rem var(--mono)}
.note{background:var(--warn-soft);border-radius:9px;padding:10px 12px;font-size:.9rem}
.empty{text-align:center;padding:60px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>


<div id="app"></div>

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
const n = v => Number(v) || 0;
const usd = v => (v < 0 ? '-' : '') + '$' + Math.abs(n(v)).toLocaleString('en-US', {maximumFractionDigits: 2});
function parseDate(s){ if(!s) return null; const [y,m,d] = s.split('-').map(Number); return y ? new Date(y, m-1, d) : null; }
function fmtDate(s, o = {weekday:'long', month:'long', day:'numeric', year:'numeric'}){ const d = parseDate(s); return d ? d.toLocaleDateString('en-US', o) : 'Date to be confirmed'; }
function daysUntil(s){ const d = parseDate(s); if(!d) return null; const t = new Date(); t.setHours(0,0,0,0); return Math.round((d - t) / 864e5); }
function fmtT(t){ if(!t) return ''; const [h, m] = t.split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2,'0')} ${h >= 12 ? 'PM' : 'AM'}`; }
function setIn(o, parts, v){ let c = o; for (let i = 0; i < parts.length - 1; i++){ const k = parts[i], nk = parts[i+1]; if (c[k] == null || typeof c[k] !== 'object') c[k] = /^\d+$/.test(nk) ? [] : {}; c = c[k]; } c[parts[parts.length-1]] = v; }
function getIn(o, parts){ return parts.reduce((c, k) => c == null ? undefined : c[k], o); }
function b64d(s){ s = s.replace(/\s+/g, '').replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const bin = atob(s); return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)))); }
function b64e(o){ const b = new TextEncoder().encode(JSON.stringify(o)); let bin = ''; for (let i = 0; i < b.length; i += 8192) bin += String.fromCharCode.apply(null, b.subarray(i, i + 8192)); return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }

const SECTIONS = [
 {key:'basics', title:'Event basics', blurb:'Who we are celebrating and who to call on the day.', fields:[
   {k:'honorees', label:'Names of the people being celebrated', type:'text', req:1, ph:'Ana Rivera & Marcus Chen'},
   {k:'pronounce', label:'How to pronounce their names', type:'text', ph:'AH-nah ree-VEH-rah'},
   {k:'intro', label:'How should the MC introduce them?', type:'text', req:1, ph:'Mr. & Mrs. Chen'},
   {k:'guests', label:'Expected guest count', type:'num'},
   {k:'dayContact', label:'Day-of contact (name & phone)', type:'text', req:1},
   {k:'planner', label:'Planner or coordinator (name & phone)', type:'text'}]},
 {key:'entrances', title:'Grand entrances', blurb:'Who walks in, in what order, and to which songs.', fields:[
   {k:'style', label:'Entrance style', type:'select', req:1, opts:['Full wedding party / court, in pairs','Parents + wedding party / court','Guests of honor only','No announced entrance']},
   {k:'partySong', label:'Wedding party / court entrance song', type:'song'},
   {k:'honoreeSong', label:'Guest of honor entrance song', type:'song', req:1},
   {k:'order', label:'Entrance order (first in → last in)', type:'list', cols:[{k:'names',label:'Names',ph:'Maria Lopez & James Park'},{k:'role',label:'Role',ph:'Maid of honor & best man'},{k:'pron',label:'Pronunciation',ph:'optional'}]}]},
 {key:'firstDance', title:'First dance', blurb:'The first dance, waltz or featured dance.', fields:[
   {k:'song', label:'Song & artist', type:'song', req:1},
   {k:'length', label:'How much of the song?', type:'select', req:1, opts:['Full song','Fade at about 2 minutes','Fade at about 3 minutes','Invite guests to join halfway']},
   {k:'edit', label:'Custom edit or mashup? Paste a link', type:'text'}]},
 {key:'specialDances', title:'Parent & special dances', blurb:'Parent dances, surprise dances, anniversary dances.', fields:[
   {k:'dances', label:'Dances in order', type:'list', req:1, cols:[{k:'who',label:'Who dances',ph:'Ana & her father, Luis'},{k:'song',label:'Song & artist',ph:'My Girl — The Temptations'}]},
   {k:'combined', label:'Combine parent dances into one song?', type:'yesno'}]},
 {key:'formalities', title:'Formalities', blurb:'Speeches, cake, toss traditions and how the night ends.', fields:[
   {k:'welcome', label:'Welcome or blessing given by', type:'text', ph:'Pastor Ruiz'},
   {k:'toasts', label:'Toasts / speeches in order', type:'list', cols:[{k:'speaker',label:'Speaker',ph:'Dana Chen'},{k:'rel',label:'Relationship',ph:'Sister of the groom'}]},
   {k:'cakeSong', label:'Cake cutting song', type:'song'},
   {k:'bouquet', label:'Bouquet / garter toss', type:'select', opts:['Both','Bouquet only','Garter only','Neither','Not applicable']},
   {k:'anniversary', label:'Anniversary dance?', type:'yesno'},
   {k:'lastSong', label:'Last song of the night', type:'song', req:1},
   {k:'sendoff', label:'Send-off plan', type:'text', ph:'Sparklers, bubbles, private last dance…'}]},
 {key:'music', title:'Music preferences', blurb:'What to play, what never to play.', fields:[
   {k:'genres', label:'Genres you want to hear', type:'chips', opts:['Top 40','Hip-hop','R&B','Latin','Reggaeton','Bachata','Salsa','Cumbia','Country','Rock','80s','90s','2000s','EDM','Afrobeats','Motown','Jazz']},
   {k:'mustPlay', label:'Must-play songs', type:'textarea', req:1, ph:'One per line: Song — Artist'},
   {k:'doNotPlay', label:'Do-not-play list', type:'textarea'},
   {k:'clean', label:'Clean (radio) edits only?', type:'yesno'},
   {k:'requests', label:'Take guest requests?', type:'select', opts:['Yes','Only if they fit the vibe','No']},
   {k:'cocktail', label:'Cocktail & dinner music vibe', type:'text', ph:'Acoustic covers, jazz, Latin lounge…'}]},
 {key:'details', title:'Other needs', blurb:'Announcements, traditions, vendors and anything else.', fields:[
   {k:'announcements', label:'Announcements for the MC', type:'textarea', ph:'Birthdays, anniversaries, thank-yous, raffle…'},
   {k:'traditions', label:'Cultural traditions or special moments', type:'textarea', ph:'Money dance, hora, lasso, la víbora…'},
   {k:'vendors', label:'Photographer / videographer (names & phones)', type:'text'},
   {k:'access', label:'Accessibility or special needs', type:'textarea'},
   {k:'notes', label:'Anything else we should know', type:'textarea'}]},
];

const SEC = Object.fromEntries(SECTIONS.map(s => [s.key, s]));
function filled(f, v){ if (f.type === 'list') return Array.isArray(v) && v.some(r => r && String(r[f.cols[0].k] || '').trim()); if (f.type === 'chips') return Array.isArray(v) && v.length > 0; return v !== undefined && v !== null && String(v).trim() !== ''; }
function secDone(key){ const s = SEC[key]; const d = A[key] || {}; const req = s.fields.filter(f => f.req); return req.length ? req.every(f => filled(f, d[f.k])) : s.fields.some(f => filled(f, d[f.k])); }

/* ---------- gig from link ---------- */
/* Link format: #CODE.SECTIONMASK.DUEYYMMDD.EVENTYYMMDD (mask bits follow SECTIONS order) */
let G = null;
try {
  const h = decodeURIComponent(location.hash.slice(1)).trim(); const parts = h.split('.');
  if (/^[A-Za-z0-9]{4,10}$/.test(parts[0] || '')){
    const ymd = x => /^\d{6}$/.test(x || '') ? `20${x.slice(0, 2)}-${x.slice(2, 4)}-${x.slice(4, 6)}` : '';
    const mask = parts[1] ? parseInt(parts[1], 36) : NaN;
    const s = isNaN(mask) || !mask ? SECTIONS.map(x => x.key) : SECTIONS.filter((x, i) => mask & (1 << i)).map(x => x.key);
    G = {c: parts[0].toUpperCase(), s, f: ymd(parts[2]), d: ymd(parts[3])};
  }
} catch {}
const KEY = G ? 'gdclient.' + G.c : '';
let A = {}, stored = true, sentAt = null;
if (G){ try { const raw = JSON.parse(localStorage.getItem(KEY) || 'null'); if (raw){ A = raw.a || {}; sentAt = raw.sentAt || null; } } catch { stored = false; } }
let saveT;
function save(){ clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify({a: A, sentAt})); } catch { if (stored){ stored = false; render(); } } }, 300); }
const secs = () => (G?.s || []).filter(k => SEC[k]);
const dj = () => 'your DJ';
const SHEET = {open: false, text: '', copied: false};

/* ---------- render ---------- */
function field(sec, f){
  const k = `${sec}.${f.k}`, v = A[sec]?.[f.k], id = `f-${sec}-${f.k}`, lab = esc(f.label) + (f.req ? ' <span class="req">*</span>' : '');
  switch (f.type){
    case 'textarea': return `<label class="f">${lab}<textarea id="${id}" data-k="${k}" placeholder="${esc(f.ph || '')}">${esc(v || '')}</textarea></label>`;
    case 'select': case 'yesno': { const o = f.type === 'yesno' ? ['Yes','No','Not sure yet'] : f.opts; return `<label class="f">${lab}<select id="${id}" data-k="${k}"><option value="">Choose…</option>${o.map(x => `<option${x === v ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select></label>`; }
    case 'num': return `<label class="f">${lab}<input id="${id}" type="number" inputmode="numeric" data-num="1" data-k="${k}" value="${esc(v ?? '')}"></label>`;
    case 'chips': { const cur = Array.isArray(v) ? v : []; return `<div class="f" style="display:flex;flex-direction:column;gap:6px"><span class="lbl">${lab}</span><div class="chips">${f.opts.map(o => `<label class="chip"><input type="checkbox" data-k="${k}" data-chip="${esc(o)}"${cur.includes(o) ? ' checked' : ''}>${esc(o)}</label>`).join('')}</div></div>`; }
    case 'list': { const rows = Array.isArray(v) && v.length ? v : [{}]; return `<div style="display:flex;flex-direction:column;gap:8px"><span class="lbl">${lab}</span>${rows.map((r, i) => `<div class="lrow" style="--cols:${f.cols.length}">${f.cols.map(c => `<input id="${id}-${i}-${c.k}" aria-label="${esc(c.label)}" placeholder="${esc(c.label + (c.ph ? ' · ' + c.ph : ''))}" data-k="${k}.${i}.${c.k}" value="${esc(r?.[c.k] || '')}">`).join('')}<button class="btn ghost sm" data-act="del" data-arg="${k}|${i}" aria-label="Remove row">✕</button></div>`).join('')}<div><button class="btn sm" data-act="add" data-arg="${k}">+ Add another</button></div></div>`; }
    default: return `<label class="f">${lab}<input id="${id}" data-k="${k}" value="${esc(v || '')}" placeholder="${esc(f.ph || (f.type === 'song' ? 'Song — Artist' : ''))}"></label>`;
  }
}
const logo = `<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="16" cy="16" r="5" fill="var(--accent)"/><path d="M16 2.8 A13.2 13.2 0 0 1 29.2 16" fill="none" stroke="var(--accent)" stroke-width="2.4"/></svg>`;
function statusHTML(){
  const ss = secs(), done = ss.filter(secDone).length, due = daysUntil(G.f);
  return `<div class="spread"><h2>What we need from you</h2><span class="pill ${done === ss.length ? 'ok' : 'warn'}">${done} of ${ss.length} done</span></div>
    <div class="row"><div class="bar"><i style="width:${ss.length ? Math.round(done / ss.length * 100) : 0}%"></i></div></div>
    ${G.f ? `<p class="small">Please finish by <b>${esc(fmtDate(G.f, {weekday:'short', month:'long', day:'numeric'}))}</b>${due != null && due >= 0 ? ` · ${due} day${due === 1 ? '' : 's'} left` : ''}.</p>` : ''}
    <div>${ss.map(k => `<div class="need"><span>${secDone(k) ? '✓ ' : ''}${esc(SEC[k].title)}</span><button class="btn sm${secDone(k) ? ' ghost' : ''}" data-act="jump" data-arg="${k}">${secDone(k) ? 'Review' : 'Fill in'}</button></div>`).join('')}</div>`;
}
function render(){
  const app = $('#app');
  if (!G){ app.innerHTML = `<div class="wrap"><div class="empty"><h1>Open the link from your DJ</h1><p class="muted">This planning form opens from the personal link your DJ sent you by text or email. Tap that link to see your event.</p></div></div>`; return; }
  const y = window.scrollY, dd = daysUntil(G.d); let opened = false;
  const ss = secs();
  app.innerHTML = `<div class="wrap">
    <div class="brandbar">${logo}<span>Event Planning</span></div>
    <div class="hero"><span class="lbl">Your planning form</span><h1>Let’s plan your event</h1>${G.d ? `<p class="muted">${esc(fmtDate(G.d))}</p>` : ''}
      ${dd != null && dd >= 0 ? `<div class="count"><b>${dd}</b><span class="muted">${dd === 1 ? 'day' : 'days'} to go</span></div>` : ''}</div>
    ${stored ? '' : '<div class="note">This browser isn’t saving your answers, so finish in one sitting and tap <b>Send to my DJ</b> before you close it.</div>'}
    <div class="panel" id="status">${statusHTML()}</div>
    <p class="small muted">Your answers save on this phone as you type, so you can come back any time. When you’re ready, tap <b>Send to my DJ</b> at the bottom.</p>
    ${ss.map(k => { const s = SEC[k]; const open = !secDone(k) && !opened; if (open) opened = true;
      return `<details class="fs" id="sec-${k}"${open ? ' open' : ''}><summary><span><h3>${esc(s.title)}</h3><span class="small muted">${esc(s.blurb)}</span></span><span data-sec="${k}">${secDone(k) ? '<span class="pill ok">Done</span>' : '<span class="pill warn">Needed</span>'}</span></summary><div class="in"><div class="grid">${s.fields.filter(f => !['list','chips','textarea'].includes(f.type)).map(f => field(k, f)).join('')}</div>${s.fields.filter(f => ['list','chips','textarea'].includes(f.type)).map(f => field(k, f)).join('')}</div></details>`; }).join('')}
    <p class="small muted" style="text-align:center">Event code ${esc(G.c)}</p>
  </div>
  <div class="dock"><div class="in"><span class="small muted">${sentAt ? 'Last sent ' + new Date(sentAt).toLocaleDateString('en-US', {month:'short', day:'numeric'}) : 'Not sent yet'}</span><button class="btn pri" data-act="send">Send to my DJ</button></div></div>
  ${SHEET.open ? sheetHTML() : ''}`;
  window.scrollTo(0, y);
}
function sheetHTML(){
  return `<div class="overlay" data-act="closeBg"><div class="sheet" role="dialog" aria-label="Send to your DJ">
    <div class="spread"><h2>${SHEET.copied ? 'Copied! Now send it' : 'Send your answers'}</h2><button class="btn ghost" data-act="close">Close</button></div>
    ${SHEET.copied ? `<div class="step"><b>1</b><span>Your answers are copied.</span></div><div class="step"><b>2</b><span>Go back to the text or email your DJ sent you with this link.</span></div><div class="step"><b>3</b><span>Paste your answers as a reply and send. You can send again any time you make changes.</span></div>`
      : `<p class="small">Your device didn’t allow automatic copying. Select all of the text below, copy it, and paste it as a reply to the text or email your DJ sent you.</p><textarea id="sendbox" readonly style="min-height:220px;font-size:.8rem">${esc(SHEET.text)}</textarea>`}
    ${SHEET.copied ? `<button class="btn pri" data-act="close">Done</button>` : ''}</div></div>`;
}
function refreshStatus(sec){ const st = $('#status'); if (st) st.innerHTML = statusHTML(); const pill = document.querySelector(`[data-sec="${sec}"]`); if (pill) pill.innerHTML = secDone(sec) ? '<span class="pill ok">Done</span>' : '<span class="pill warn">Needed</span>'; }
let toastT;
function toast(t){ clearTimeout(toastT); let el = $('#toast'); if (!el){ el = document.createElement('div'); el.className = 'toast'; el.id = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); } el.textContent = t; toastT = setTimeout(() => el.remove(), 3000); }

/* ---------- send ---------- */
function answersText(){
  const L = [`Planning answers · event code ${G.c}${G.d ? ' · ' + fmtDate(G.d) : ''}`, ''];
  secs().forEach(k => { const s = SEC[k]; const out = []; s.fields.forEach(f => { const v = A[k]?.[f.k]; if (!filled(f, v)) return; if (f.type === 'list') out.push(`${f.label}:`, ...v.filter(r => r && r[f.cols[0].k]).map((r, i) => `  ${i + 1}. ` + f.cols.map(c => r[c.k]).filter(Boolean).join(' · '))); else if (f.type === 'chips') out.push(`${f.label}: ${v.join(', ')}`); else out.push(`${f.label}: ${v}`); }); if (out.length) L.push(s.title.toUpperCase(), ...out, ''); });
  L.push('(Leave the code below as is. It loads these answers into Gig Desk.)', `GIGDESK-ANSWERS ${G.c} B64:${b64e(A)}:END`);
  return L.join('\n');
}
async function send(){
  const text = answersText(); SHEET.text = text; SHEET.open = true; SHEET.copied = false;
  try { await navigator.clipboard.writeText(text); SHEET.copied = true; } catch {}
  sentAt = Date.now(); save(); render();
  if (!SHEET.copied){ const b = $('#sendbox'); if (b){ b.focus(); b.select(); } }
}

/* ---------- events ---------- */
const ACT = {
  add(k){ const p = k.split('.'); const arr = clone(getIn(A, p) || []); if (!arr.length) arr.push({}); arr.push({}); setIn(A, p, arr); save(); render(); },
  del(arg){ const [k, i] = arg.split('|'); const p = k.split('.'); const arr = clone(getIn(A, p) || []); arr.splice(+i, 1); setIn(A, p, arr); save(); render(); refreshStatus(p[0]); },
  jump(k){ const d = $('#sec-' + k); if (d){ d.open = true; d.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start'}); } },
  send, close(){ SHEET.open = false; render(); }, closeBg(){},
  async copyContact(){ try { await navigator.clipboard.writeText(G.p); toast('Contact copied'); } catch { const r = document.createRange(); const el = $('#djc'); if (el){ r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } } },
};
document.addEventListener('click', e => {
  if (e.target.classList?.contains('overlay')){ SHEET.open = false; render(); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.dataset.act === 'closeBg') return; e.preventDefault(); ACT[b.dataset.act]?.(b.dataset.arg);
});
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset.k; if (!k) return; const p = k.split('.'); let v;
  if (el.dataset.chip != null){ const cur = clone(getIn(A, p) || []); v = el.checked ? [...new Set([...cur, el.dataset.chip])] : cur.filter(x => x !== el.dataset.chip); }
  else if (el.dataset.num) v = el.value === '' ? '' : Number(el.value);
  else v = el.value;
  setIn(A, p, v); save(); refreshStatus(p[0]);
});
render();
})();
</script>

</body>
</html>
